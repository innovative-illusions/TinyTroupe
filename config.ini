###############################################################################
# TinyTroupe — project-level configuration
#
# This file overrides the bundled tinytroupe/config.ini defaults.
# You only need to include the keys you want to change.
#
# Resolution order (highest → lowest priority):
#   1. TINYTROUPE_* environment variables
#   2. This file  (config.ini in the working directory)
#   3. tinytroupe/config.ini  (bundled defaults)
#
# Quick env-var overrides (no file editing required):
#   TINYTROUPE_API_TYPE=ollama
#   TINYTROUPE_MODEL=gpt-4o
#   TINYTROUPE_OLLAMA_BASE_URL=http://192.168.1.10:11434/v1
#
# API credentials go in .env (see .env.example), not here.
###############################################################################

[LLM]
# Active provider. Options: openai, azure, ollama, anthropic, groq
API_TYPE=openai

MODEL=gpt-4o
MAX_COMPLETION_TOKENS=128000
TIMEOUT=240
MAX_ATTEMPTS=2
WAITING_TIME=2
EXPONENTIAL_BACKOFF_FACTOR=5

EMBEDDING_MODEL=text-embedding-3-small
AZURE_EMBEDDING_MODEL_API_VERSION=2023-05-15
AZURE_API_VERSION=2024-12-01-preview

# ===========================================================================
# Per-provider overrides
#
# Uncomment and edit the section for your chosen provider.
# These values override the matching [LLM] keys when that provider is active.
# ===========================================================================

#[openai]
#MODEL=gpt-4o
# Custom endpoint (proxy, LM Studio, etc.):
#BASE_URL=http://localhost:1234/v1
# Name of the env var that holds your API key (default: OPENAI_API_KEY):
#API_KEY_ENV_VAR=OPENAI_API_KEY

#[azure]
#MODEL=gpt-4o
#AZURE_API_VERSION=2024-12-01-preview

#[ollama]
#BASE_URL=http://localhost:11434/v1
#MODEL=gemma3:4b-it
#NUM_CTX=32768
#MAX_COMPLETION_TOKENS=8192

#[anthropic]
#MODEL=claude-sonnet-4-6
#MAX_COMPLETION_TOKENS=16000

#[groq]
#MODEL=llama-3.3-70b-versatile
#MAX_COMPLETION_TOKENS=32768


[Logging]
LOGLEVEL=DEBUG
LOG_INCLUDE_THREAD_ID=True
