###############################################################################
# TinyTroupe Configuration
#
# This file sets the bundled defaults. To override, create a config.ini in
# your working directory (only the keys you want to change are needed).
#
# You can also override any [LLM] key with an environment variable:
#   TINYTROUPE_<KEY>=value          e.g. TINYTROUPE_MODEL=gpt-4o
#   TINYTROUPE_<PROVIDER>_<KEY>=value  e.g. TINYTROUPE_OLLAMA_BASE_URL=http://...
#
# Backward compatibility: [OpenAI] section is still accepted in custom configs.
###############################################################################

[LLM]
###############################################################################
# General LLM settings — apply to whichever provider is active.
# Provider-specific sections below ([openai], [azure], [ollama], etc.)
# override these values when their API_TYPE is selected.
###############################################################################

# Active provider. Options: openai, azure, ollama, anthropic, groq
API_TYPE=openai

#
# Models
#

# Main text-generation model used for agent responses
MODEL=gpt-4o

# Reasoning model — used when precise step-by-step reasoning is required
REASONING_MODEL=o3-mini

# Embedding model — used for text-similarity / memory retrieval
EMBEDDING_MODEL=text-embedding-3-small

#
# Model parameters
#
MAX_COMPLETION_TOKENS=128000
TEMPERATURE=
TOP_P=
FREQ_PENALTY=
PRESENCE_PENALTY=
REASONING_EFFORT=high

# Ollama-specific context window size (ignored by other providers)
NUM_CTX=32000

#
# Request / retry behaviour
#
TIMEOUT=480
MAX_ATTEMPTS=5
WAITING_TIME=1
EXPONENTIAL_BACKOFF_FACTOR=5

# Maximum concurrent model calls. Set to 0 or NONE to disable.
MAX_CONCURRENT_MODEL_CALLS=4

#
# Caching
#
CACHE_API_CALLS=False
CACHE_FILE_NAME=openai_api_cache.pickle

#
# Display
#
MAX_CONTENT_DISPLAY_LENGTH=4000


###############################################################################
# Per-provider sections
#
# Keys here override the matching [LLM] key when that provider is active.
# API credentials belong in environment variables, NOT here.
###############################################################################

[openai]
# Standard OpenAI API.
# Credentials: OPENAI_API_KEY (required)
#              OPENAI_BASE_URL (optional — overrides endpoint, e.g. for a proxy)
MODEL=gpt-4o
REASONING_MODEL=o3-mini
EMBEDDING_MODEL=text-embedding-3-small

[azure]
# Azure OpenAI Service.
# Credentials: AZURE_OPENAI_KEY + AZURE_OPENAI_ENDPOINT  (key-based auth)
#           OR just AZURE_OPENAI_ENDPOINT                 (Entra ID auth)
AZURE_API_VERSION=2024-12-01-preview
AZURE_EMBEDDING_MODEL_API_VERSION=2023-05-15
MODEL=gpt-4o
REASONING_MODEL=o3-mini
EMBEDDING_MODEL=text-embedding-3-small

[ollama]
# Local Ollama server (https://ollama.ai).
# No API key required.
BASE_URL=http://localhost:11434/v1
MODEL=gemma3:4b-it
# num_ctx sets the Ollama context window — tune to your model's capability
NUM_CTX=32768
MAX_COMPLETION_TOKENS=8192

[anthropic]
# Anthropic Claude API.
# Credentials: ANTHROPIC_API_KEY (required)
MODEL=claude-sonnet-4-6
REASONING_MODEL=claude-opus-4-6
MAX_COMPLETION_TOKENS=16000

[groq]
# Groq Cloud — OpenAI-compatible, very fast inference.
# Credentials: GROQ_API_KEY (required)
BASE_URL=https://api.groq.com/openai/v1
MODEL=llama-3.3-70b-versatile
MAX_COMPLETION_TOKENS=32768


###############################################################################
[Simulation]
###############################################################################

PARALLEL_AGENT_GENERATION=True
PARALLEL_AGENT_ACTIONS=True

RAI_HARMFUL_CONTENT_PREVENTION=True
RAI_COPYRIGHT_INFRINGEMENT_PREVENTION=True


###############################################################################
[Cognition]
###############################################################################

ENABLE_MEMORY_CONSOLIDATION=True
ENABLE_CONTINUOUS_CONTEXTUAL_SEMANTIC_MEMORY_RETRIEVAL=True

MIN_EPISODE_LENGTH=10
MAX_EPISODE_LENGTH=15

EPISODIC_MEMORY_FIXED_PREFIX_LENGTH=10
EPISODIC_MEMORY_LOOKBACK_LENGTH=20


###############################################################################
[ActionGenerator]
###############################################################################

MAX_ATTEMPTS=2

# Master switch — enables all quality checks below
ENABLE_QUALITY_CHECKS=False

ENABLE_REGENERATION=True
ENABLE_DIRECT_CORRECTION=False

ENABLE_QUALITY_CHECK_FOR_PERSONA_ADHERENCE=True
ENABLE_QUALITY_CHECK_FOR_SELFCONSISTENCY=False
ENABLE_QUALITY_CHECK_FOR_FLUENCY=False
ENABLE_QUALITY_CHECK_FOR_SUITABILITY=False
ENABLE_QUALITY_CHECK_FOR_SIMILARITY=False

CONTINUE_ON_FAILURE=True

# 0 to 9
QUALITY_THRESHOLD=5


###############################################################################
[Logging]
###############################################################################

# Root log level. Also affects third-party libraries that inherit root logging.
# Use NONE to leave the root logger untouched.
LOGLEVEL=ERROR

# Per-target overrides (NONE disables that target entirely)
LOGLEVEL_CONSOLE=INFO
LOGLEVEL_FILE=DEBUG

# Include thread identifiers in log lines (True/False)
LOG_INCLUDE_THREAD_ID=True
