# Example config for standard OpenAI usage.
# Copy to your working directory and adjust as needed.

[LLM]
# Active provider — options: openai, azure, ollama, anthropic, groq
API_TYPE=openai

MODEL=qwen3.5-4b-uncensored
MAX_COMPLETION_TOKENS=32000
TIMEOUT=480
MAX_ATTEMPTS=5
WAITING_TIME=0
EXPONENTIAL_BACKOFF_FACTOR=5

EMBEDDING_MODEL=text-embedding-qwen3-embedding-0.6b
AZURE_API_VERSION=2024-08-01-preview
AZURE_EMBEDDING_MODEL_API_VERSION=2023-05-15

CACHE_API_CALLS=False
CACHE_FILE_NAME=openai_api_cache.pickle
MAX_CONTENT_DISPLAY_LENGTH=1024

[Simulation]
PARALLEL_AGENT_GENERATION=False
PARALLEL_AGENT_ACTIONS=False
RAI_HARMFUL_CONTENT_PREVENTION=False
RAI_COPYRIGHT_INFRINGEMENT_PREVENTION=False

[Logging]
LOGLEVEL=ERROR
LOGLEVEL_CONSOLE=INFO
