# Example config for running TinyTroupe against a local Ollama server.
# Copy to your working directory and adjust as needed.
#
# Start Ollama, then pull a model:
#   ollama serve
#   ollama pull gemma3:4b-it
#
# API keys are not required for Ollama.

[LLM]
API_TYPE=ollama

[ollama]
BASE_URL=http://localhost:11434/v1

# Ollama models must be pulled locally first.
# Larger context variants (e.g. *-32k) handle TinyTroupe's long system prompts better.
MODEL=gemma3:4b-it
#MODEL=gemma3:1b-it
#MODEL=llama3.2:3b

NUM_CTX=32768
TEMPERATURE=1.0
FREQ_PENALTY=0.1
PRESENCE_PENALTY=0.1
MAX_COMPLETION_TOKENS=8192

[Logging]
LOGLEVEL=DEBUG
